  var h = '<div class="card"><b>Choose the night</b><p class="muted">Nights found in your Drive folder "' + esc(setting('input', '')) + '". Pick one and the report is built from the files in it.</p>';
  if (!UI.nights.length) h += '<p class="muted">No folders or files named with a date were found. Name the night folder like 2026-11-12 or 12.11.2026.</p>';
  h += UI.nights.map(function (n) {
    return '<div class="item"><div><b>' + fmtNight(n.iso) + '</b><div class="muted">' + esc(n.name) + (saved[n.iso] ? ' · report saved' : '') + '</div></div><div class="btns"><button class="pri" onclick="A.pick(\'' + n.iso + '\')">Make report</button></div></div>';
  }).join('');
  h += '</div>';
  return h;
}

function viewSettings() {
  return '<div class="card"><b>Settings</b>' +
    '<label>Google Client ID<input id="s_cid" value="' + esc(setting('client_id', '')) + '" placeholder="123456-abc.apps.googleusercontent.com"></label>' +
    '<label>Drive input folder (name or link)<input id="s_input" value="' + esc(setting('input', '')) + '" placeholder="Night Inputs"></label>' +
    '<label>Report title<input id="s_title" value="' + esc(setting('title', 'W12 night shift report')) + '"></label>' +
    '<div class="btns"><button class="pri" onclick="A.saveSettings()">Save</button><button onclick="A.go(\'home\')">Cancel</button></div></div>';
}

function fromDriveCard() {
  var s = S.src || { warnings: [] };
  if (!s.nightIso) return '';
  var h = '<div class="card"><b>Found in Drive</b><p class="muted">Folder: ' + esc(s.folderName) + '</p>';
  if (S.dabs.jobs.length) {
    var sm = calcSummary(S.dabs.jobs);
    h += '<p><b>DABS</b> · ' + esc(S.dabs.file) + '<br>' + sm.total + ' jobs ' + chip(sm.done, 'd', 'done') + chip(sm.ongoing, 'o', 'ongoing') + chip(sm.notdone, 'n', 'not done') + '</p>';
  } else h += '<p><b>DABS</b> · not found</p>';
  if (s.hcSource) {
    var c = s.hcCheck;
    h += '<p><b>Headcount</b> · ' + esc(s.hcSource) + '<br>' + (c ? (c.ok ? '<span class="okmsg">Rows add up to the TOTAL (' + c.sum + ').</span>' : '<span class="badmsg">Rows add up to ' + c.sum + ' but the TOTAL says ' + c.total + '. Check the highlighted rows below.</span>') : '') + (c && c.note ? '<br><span class="muted">' + esc(c.note) + '</span>' : '') + '</p>';
    if (s.hcImg) h += '<img class="refimg" src="' + s.hcImg + '" alt="Headcount picture">';
  } else h += '<p><b>Headcount</b> · not found, enter the numbers below</p>';
  if (s.welderImg) h += '<p><b>Welding sheet</b><br><span class="muted">' + (s.welderAuto ? 'Welder numbers were read from this sheet. Check them in step 2.' : 'Count the welders in each group and enter them in step 2.') + '</span></p><img class="refimg" src="' + s.welderImg + '" alt="Welding sheet">';
  else h += '<p><b>Welding sheet</b> · not found. If it went to the photos, open its menu under "Photos" and pick "This is the welding sheet".</p>';
  var bl = S.photos.filter(function (p) { return p.kind === 'blocker'; }).length;
  h += '<p><b>Photos</b> · ' + S.photos.length + ' (' + bl + ' blocker)</p>';
  if (s.files && s.files.length) {
    var RL = { 'dabs': 'DABS (Excel)', 'dabs-img': 'DABS (picture)', 'headcount-img': 'Headcount', 'headcount-text': 'Headcount', 'welder-img': 'Welding sheet', 'photo-work': 'Photo', 'photo-blocker': 'Blocker photo', 'heic': 'Skipped (iPhone HEIC)', 'ignore': 'Not used' };
    h += '<details><summary>Files in the folder (' + s.files.length + ')</summary><ul class="filelist">' + s.files.map(function (f) { return '<li>' + esc(f.name) + ' → <b>' + esc(RL[f.role] || f.role) + '</b></li>'; }).join('') + '</ul></details>';
  } else h += '<p class="badmsg">No files were found in this folder.</p>';
  if (s.warnings.length) h += '<ul class="warnlist">' + s.warnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>';
  h += '<button onclick="A.reload()">Reload from Drive</button></div>';
  return h;
}

function viewEdit() {
  var h = fromDriveCard();
  h += '<div class="card"><b>1. Headcount</b><div id="hcRows">' + hcRowsHtml() + '</div><div class="btns"><button onclick="A.hcAdd()">Add row</button></div></div>';

  var w = S.welders;
  h += '<div class="card"><b>2. Welder distribution</b>' + (S.src && S.src.welderAuto ? '<p class="badmsg">Filled from the handwritten welding sheet. Check each number against the sheet above.</p>' : '') + '<div class="grid5">' +
    [['ws', 'Welding support'], ['wsp', 'Welding spool'], ['fs', 'Fit-up support'], ['fsp', 'Fit-up spool'], ['ch', 'CH']].map(function (f) {
      return '<label>' + f[1] + '<input type="number" min="0" inputmode="numeric" value="' + (w[f[0]] || 0) + '" oninput="A.setWelder(\'' + f[0] + '\',this.value)"></label>';
    }).join('') + '</div></div>';

  h += '<div class="card"><b>3. Concerns</b><p class="muted">Taken from the DABS file when it has a concern list. Edit or add as needed.</p><div id="conRows">' + concernRowsHtml() + '</div><button onclick="A.conAdd()">Add concern</button></div>';

  h += '<div class="card"><b>4. Photos</b>' + (S.photos.length ? '' : '<p class="muted">No photos found in the folder.</p>') + '<div id="phRows">' + photoRowsHtml() + '</div></div>';

  h += '<div class="bar"><button class="pri" onclick="A.preview()">Preview report</button></div>';
  return h;
}

function hcRowsHtml() {
  return S.headcount.map(function (r, i) {
    return '<div class="hcrow' + (r.unsure ? ' unsure' : '') + '"><input value="' + esc(r.name) + '" oninput="A.hcName(' + i + ',this.value)"><input type="number" min="0" inputmode="numeric" value="' + (parseInt(r.count, 10) || 0) + '" oninput="A.hcCount(' + i + ',this.value)"><button aria-label="Remove row" onclick="A.hcDel(' + i + ')">×</button></div>';
  }).join('') + '<div class="muted" style="margin-top:6px">Total: <b id="hcTotal">' + sumCounts(S.headcount) + '</b></div>';
}

function concernRowsHtml() {
  return S.concerns.map(function (c, i) {
    return '<div class="conrow"><select onchange="A.conTrade(' + i + ',this.value)">' + CONCERN_TRADES.map(function (t) { return '<option' + (t === c.trade ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>' +
      '<input value="' + esc(c.text) + '" placeholder="Concern" oninput="A.conText(' + i + ',this.value)"><button aria-label="Remove concern" onclick="A.conDel(' + i + ')">×</button></div>';
  }).join('');
}

function photoRowsHtml() {
  return S.photos.map(function (p, i) {
    return '<div class="phrow"><img src="' + p.url + '" alt=""><div><select onchange="A.phKind(' + i + ',this.value)"><option value="work"' + (p.kind === 'work' ? ' selected' : '') + '>Work done</option><option value="blocker"' + (p.kind === 'blocker' ? ' selected' : '') + '>Blocker</option><option value="welder">This is the welding sheet</option></select>' +
      '<input value="' + esc(p.caption) + '" placeholder="Caption (tag or short note)" oninput="A.phCap(' + i + ',this.value)"></div><button aria-label="Remove photo" onclick="A.phDel(' + i + ')">×</button></div>';
  }).join('');
}

function viewPreview() {
  var pages = buildReportPages(reportData(), UI.index);
  var h = '<div class="bar"><button onclick="A.go(\'edit\')">Back</button><button class="pri" onclick="A.save()">Save to Drive</button><button onclick="A.downloadPdf()">Download PDF</button></div>';
  h += '<div id="pv">' + pages.map(function (p) { return '<div class="pvwrap"><div class="pvin">' + p + '</div></div>'; }).join('') + '</div>';
  return h;
}

function fitPreview() {
  var pv = document.getElementById('pv');
  if (!pv) return;
  var sc = Math.min(1, (pv.clientWidth || 794) / 794);
  pv.querySelectorAll('.pvwrap').forEach(function (w) {
    w.style.height = Math.round(1123 * sc) + 'px';
    var inner = w.firstChild;
    inner.style.transform = 'scale(' + sc + ')';
    inner.style.transformOrigin = 'top left';
  });
}

function render() {
  var m = document.getElementById('main');
  var title = { home: 'Night Report', nights: 'New report', edit: 'Review · ' + fmtNight(S.date), preview: 'Preview', settings: 'Settings' }[UI.view];
  document.getElementById('ttl').textContent = title;
  document.getElementById('back').style.display = UI.view === 'home' ? 'none' : '';
  m.innerHTML = UI.view === 'home' ? viewHome() : UI.view === 'nights' ? viewNights() : UI.view === 'edit' ? viewEdit() : UI.view === 'preview' ? viewPreview() : viewSettings();
  document.getElementById('busy').style.display = UI.busy ? 'flex' : 'none';
  document.getElementById('busyMsg').textContent = UI.busy;
  if (UI.view === 'preview') fitPreview();
  if (UI.lastView !== UI.view) { window.scrollTo(0, 0); UI.lastView = UI.view; }
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 5500);
}

function say(msg) { UI.busy = msg; var e = document.getElementById('busyMsg'); if (e) e.textContent = msg; }

async function withBusy(msg, fn) {
  UI.busy = msg; render();
  try { return await fn(); }
  catch (e) { toast(e.message || String(e)); }
  finally { UI.busy = ''; render(); }
}

/* ---------- Actions ---------- */
var A = {
  go: function (v) { UI.view = v; render(); },
  back: function () { UI.view = UI.view === 'preview' ? 'edit' : UI.view === 'edit' ? 'nights' : 'home'; if (UI.view === 'nights' && !UI.nights.length) UI.view = 'home'; render(); },

  saveSettings: function () {
    localStorage.setItem('nr_client_id', document.getElementById('s_cid').value.trim());
    localStorage.setItem('nr_input', document.getElementById('s_input').value.trim());
    localStorage.setItem('nr_title', document.getElementById('s_title').value.trim() || 'W12 night shift report');
    tokenClient = null; accessToken = '';
    toast('Settings saved');
    UI.view = 'home'; render();
  },

  signIn: function () {
    withBusy('Signing in…', async function () {
      await getToken(true);
      UI.signed = true;
      await refreshIndex();
    });
  },

  openNights: function () {
    withBusy('Looking in your Drive folder…', async function () {
      if (!UI.signed) { await getToken(true); UI.signed = true; await refreshIndex(); }
      UI.nights = await listNights();
      UI.view = 'nights';
    });
  },

  pick: function (iso) {
    var n = UI.nights.filter(function (x) { return x.iso === iso; })[0];
    if (!n) return;
    UI.curNight = n;
    withBusy('Reading the files for ' + fmtNight(iso) + '…', async function () {
      S = await pullNight(n, say);
      UI.view = 'edit';
    });
  },

  reload: function () {
    if (!UI.curNight || (S.src && !S.src.nightIso)) return;
    if (!confirm('Read the folder again? Changes you made on this screen will be replaced.')) return;
    A.pick(UI.curNight.iso);
  },

  openNight: function (date) {
    var e = UI.index.filter(function (x) { return x.date === date; })[0];
    if (!e) return;
    withBusy('Opening ' + fmtNight(date) + '…', async function () { await loadNight(e); UI.view = 'preview'; });
  },

  hcName: function (i, v) { S.headcount[i].name = v; },
  hcCount: function (i, v) { S.headcount[i].count = parseInt(v, 10) || 0; S.headcount[i].unsure = false; document.getElementById('hcTotal').textContent = sumCounts(S.headcount); },
  hcDel: function (i) { S.headcount.splice(i, 1); render(); },
  hcAdd: function () { S.headcount.push({ name: '', count: 0 }); render(); },

  setWelder: function (k, v) { S.welders[k] = parseInt(v, 10) || 0; },

  conAdd: function () { S.concerns.push({ trade: 'All', text: '' }); render(); },
  conTrade: function (i, v) { S.concerns[i].trade = v; },
  conText: function (i, v) { S.concerns[i].text = v; },
  conDel: function (i) { S.concerns.splice(i, 1); render(); },

  phKind: function (i, v) {
    if (v === 'welder') {
      var p = S.photos.splice(i, 1)[0]; S.src.welderImg = p.url; if (p.id) S.removedPhotoIds.push(p.id);
      if (!window.Tesseract) { render(); return; }
      withBusy('Counting welders on the welding sheet…', async function () {
        var best = null;
        for (var r = 0; r < 3; r++) { var x = await readWelderSheet(p.url, tessRec, tessWords, [0, 270, 90][r]); if (x.found && (!best || x.ws + x.wsp + x.fs + x.fsp > best.ws + best.wsp + best.fs + best.fsp)) best = x; }
        if (best) { S.welders = { ws: best.ws, wsp: best.wsp, fs: best.fs, fsp: best.fsp, ch: best.ch }; S.src.welderAuto = true; toast('Welder numbers filled in. Check them in step 2.'); }
        else toast('The welder numbers could not be read. Enter them in step 2.');
      });
      return;
    }
    S.photos[i].kind = v;
  },
  phCap: function (i, v) { S.photos[i].caption = v; },
  phDel: function (i) { var p = S.photos.splice(i, 1)[0]; if (p && p.id) S.removedPhotoIds.push(p.id); render(); },

  preview: function () { UI.view = 'preview'; render(); },

  save: function () {
    withBusy('Building PDF and saving to Drive…', async function () {
      var pdf = await makePdf();
      var e = await saveNight(pdf);
      toast('Saved to Drive: ' + fmtNight(e.date));
    });
  },

  downloadPdf: function () {
    withBusy('Building PDF…', async function () {
      var pdf = await makePdf();
      var a = document.createElement('a');
      a.href = URL.createObjectURL(pdf); a.download = 'Night report ' + S.date + '.pdf';
      document.body.appendChild(a); a.click(); a.remove();
    });
  }
};

/* ---------- Boot ---------- */
function boot() {
  var st = document.createElement('style');
  st.textContent = REPORT_CSS;
  document.head.appendChild(st);
  document.getElementById('gear').onclick = function () { UI.view = 'settings'; render(); };
  window.addEventListener('resize', fitPreview);
  render();
  if (localStorage.getItem('nr_signed') && setting('client_id', '')) {
    var tries = 0;
    (function wait() {
      if (window.google && google.accounts && google.accounts.oauth2) {
        getToken(false).then(function () { UI.signed = true; return refreshIndex(); }).then(render).catch(function () { render(); });
      } else if (tries++ < 40) setTimeout(wait, 250);
    })();
  }
}
if (typeof document !== 'undefined' && document.getElementById('main')) boot();

</script>
</body>
</html>
