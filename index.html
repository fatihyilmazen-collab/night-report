<header><button id="back" aria-label="Back" onclick="A.back()" style="display:none">&#8592;</button><h1 id="ttl">Night Report</h1><button id="gear" aria-label="Settings">&#9881;</button></header>

<script>
/* ---------- Core logic (pure functions) ---------- */
var STATUS = { DONE: 'DONE', ONGOING: 'ONGOING', NOTDONE: 'NOT DONE' };
var ACT_ORDER = ['Support welding', 'Support erection', 'Spool welding', 'Spool erection', 'Fit-up', 'Cutting', 'Lifting', 'Other'];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function normStatus(v) {
  var s = String(v == null ? '' : v).toUpperCase().replace(/[\s_\-]+/g, '');
  if (s === 'DONE') return STATUS.DONE;
  if (s === 'ONGOING') return STATUS.ONGOING;
  if (s === 'NOTDONE') return STATUS.NOTDONE;
  if (s === 'X') return STATUS.NOTDONE;
  return '';
}

function classifyActivity(job) {
  var a = (job.act || '').toLowerCase();
  if (/fit[\s\-]?up/.test(a)) return 'Fit-up';
  if (/\bcut/.test(a)) return 'Cutting';
  if (/erect/.test(a)) return job.kind === 'spool' ? 'Spool erection' : 'Support erection';
  if (/lift|load|pallet|crane|rigg|removal|transport|move/.test(a)) return 'Lifting';
  if (/weld|grind|flush|repair/.test(a)) return job.kind === 'spool' ? 'Spool welding' : 'Support welding';
  return 'Other';
}

function blockerCategory(remark) {
  var m = /blocker\s*:\s*([^\-–—\n]*)/i.exec(remark || '');
  if (!m) return null;
  var t = m[1].trim().toLowerCase();
  if (!t) return 'Other';
  if (t.indexOf('manpower') === 0 || /^\w{0,2}anpow/.test(t) || /npower/.test(t)) return 'Manpower';
  if (t.indexOf('time') === 0) return 'Time ran out';
  if (t.indexOf('other') === 0) return 'Other';
  return t.charAt(0).toUpperCase() + t.slice(1);
}

var MONTHS = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };

function detectNight(title, refYear) {
  var m = /(\d{1,2})\s*(?:ST|ND|RD|TH)?[\s\-]*(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)/i.exec(title || '');
  if (!m) return '';
  var d = parseInt(m[1], 10), mo = MONTHS[m[2].toUpperCase()];
  var y = refYear || new Date().getFullYear();
  return y + '-' + String(mo + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}

/* rows: array of arrays (sheet_to_json header:1). Returns {jobs, night, warnings} */
function parseDabs(rows, refYear) {
  var descCol = -1, section = null, cols = null, jobs = [], night = '', warnings = [], concerns = [], mode = '', hcLines = [];
  for (var i = 0; i < rows.length; i++) {
    var texts = (rows[i] || []).map(function (c) { return c == null ? '' : String(c).trim(); });
    var joined = texts.join(' ').toUpperCase();
    if (!joined.trim()) continue;
    var isHeader = joined.indexOf('ACTIVITY DESCRIPTION') >= 0;
    if (!isHeader && /DABS/.test(joined) && /(SUPPORT|SPOOL)/.test(joined)) {
      mode = '';
      var title = texts.filter(Boolean)[0] || '';
      section = { night: /NIGHT\s*ADDED/.test(joined), kind: /SPOOL/.test(joined) ? 'spool' : 'support', title: title };
      cols = null;
      if (!night) night = detectNight(title, refYear);
      continue;
    }
    if (!isHeader && /CONCERN/.test(joined) && !/DABS/.test(joined) && texts.filter(Boolean).length <= 2) { mode = 'concerns'; section = null; cols = null; continue; }
    if (!isHeader && /HEAD\s?COUNT/.test(joined) && !/DABS/.test(joined) && texts.filter(Boolean).length <= 2) { mode = 'headcount'; section = null; cols = null; continue; }
    if (mode === 'concerns') {
      var cells = texts.filter(Boolean);
      /* a header row of the concern list tells which column holds the description */
      if (/DESCRIPTION|DETAILS?|CONCERN/.test(joined) && /(RAISED|BY|DATE|TIME|TRADE|NAME|OWNER)/.test(joined) && cells.length >= 2) {
        descCol = texts.findIndex(function (t) { return /description|details?|concern/i.test(t); });
        continue;
      }
      if (!cells.length || /^(NO\s+(OPEN\s+)?CONCERNS?|NONE|-)$/.test(cells.join(' ').toUpperCase().trim())) continue;
      concerns.push(cellsToConcern(cells, descCol >= 0 ? texts[descCol] : null));
      continue;
    }
    if (mode === 'headcount') { hcLines.push(texts.filter(Boolean).join(' ')); continue; }
    if (isHeader) {
      cols = { act: -1, tag: -1, level: -1, remark: -1, trades: [] };
      texts.forEach(function (t, idx) {
        var u = t.toUpperCase();
        if (u.indexOf('ACTIVITY DESCRIPTION') >= 0) cols.act = idx;
        else if (/TAG|MATERIAL/.test(u)) cols.tag = idx;
        else if (/LEVEL/.test(u)) cols.level = idx;
        else if (/REMARK|BLOCKER/.test(u)) cols.remark = idx;
        else if (/PLAT|PIPING|LIFT|SCAFF|QC/.test(u)) cols.trades.push(idx);
      });
      continue;
    }
    if (!section || !cols) continue;
    var act = texts[cols.act] || '';
    var tag = cols.tag >= 0 ? texts[cols.tag] || '' : '';
    if (!act && !tag) continue;
    var status = '';
    for (var k = 0; k < cols.trades.length && !status; k++) status = normStatus(texts[cols.trades[k]]);
    if (!status) { warnings.push('No status for row ' + (i + 1) + ': ' + (tag || act)); continue; }
    var job = {
      kind: section.kind,
      night: section.night,
      level: cols.level >= 0 ? texts[cols.level] : '',
      tag: tag,
      act: act,
      status: status,
      remark: cols.remark >= 0 ? texts[cols.remark] : ''
    };
    job.cat = classifyActivity(job);
    jobs.push(job);
  }
  var hc = hcLines.length ? parseHeadcount(hcLines.join('\n')) : null;
  return { jobs: jobs, night: night, warnings: warnings, concerns: concerns, headcount: hc && hc.rows.length >= 3 ? hc : null };
}

var CONCERN_TRADE_WORDS = ['Plating', 'Piping', 'Lifting', 'Scaffolding', 'QC', 'All'];
/* Only the description is kept: who wrote it and when are left out */
function cellsToConcern(cells, desc) {
  var trade = 'All', rest = [];
  cells.forEach(function (c) {
    var t = c.trim();
    var hit = CONCERN_TRADE_WORDS.filter(function (w) { return new RegExp('^' + w + '$', 'i').test(t); })[0];
    if (hit && trade === 'All') { trade = hit; return; }
    if (/^[\d\s:\/.\-]+(am|pm)?$/i.test(t)) return;                 /* dates and times */
    if (/^(blocker|fix needed|concern|issue|risk|info|note|open|closed)$/i.test(t)) return; /* type / status words */
    rest.push(t);
  });
  var text = desc && String(desc).trim() ? String(desc).trim() : rest.sort(function (a, b) { return b.length - a.length; })[0] || '';
  return { trade: trade, text: text };
}

function mkIso(y, mo, d) {
  y = parseInt(y, 10); mo = parseInt(mo, 10); d = parseInt(d, 10);
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
  return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}

/* Date written in a folder or file name (UK order dd-mm for numeric dates) */
function parseDateName(name, refYear) {
  var s = String(name || ''), m;
  if ((m = /(?:^|\D)(20\d{2})[-._ \/](\d{1,2})[-._ \/](\d{1,2})(?!\d)/.exec(s))) return mkIso(m[1], m[2], m[3]);
  if ((m = /(?:^|\D)(\d{1,2})[-._ \/](\d{1,2})[-._ \/](20\d{2}|\d{2})(?!\d)/.exec(s))) return mkIso(m[3].length === 2 ? '20' + m[3] : m[3], m[2], m[1]);
  if ((m = /(\d{1,2})\s*(?:st|nd|rd|th)?[-._ ]*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[-._ ,]*(20\d{2})?/i.exec(s))) return mkIso(m[3] || refYear || new Date().getFullYear(), MONTHS[m[2].toUpperCase()] + 1, m[1]);
  return '';
}

/* What a file in the night folder is for. parentKind: '' | 'work' | 'blocker' */
function classifyFile(name, mime, parentKind) {
  var n = String(name || '').toLowerCase(), mt = String(mime || '');
  var isImg = /\.(jpe?g|png|webp)$/.test(n) || /^image\/(jpeg|png|webp)$/.test(mt);
  var isHeic = /\.(heic|heif)$/.test(n) || /^image\/hei/.test(mt);
  var isSheet = /\.(xlsx|xlsm|xls)$/.test(n) || /spreadsheet|ms-excel/.test(mt);
  var isText = /\.(txt|csv)$/.test(n) || /^text\//.test(mt);
  if (isHeic) return 'heic';
  if (/\.pdf$/.test(n) || mt === 'application/pdf') return 'pdf';
  if (mt === 'application/vnd.google-apps.document') return 'gdoc';
  if (/head\s*-?\s*count|(^|[^a-z])hc([^a-z]|$)/.test(n)) return isImg ? 'headcount-img' : (isSheet || isText) ? 'headcount-text' : 'ignore';
  if (isSheet) return 'dabs';
  if (isText) return 'text';
  if (isImg && /weld|kaynak/.test(n)) return 'welder-img';
  if (isImg && /dabs/.test(n)) return 'ignore';
  if (isImg && (parentKind === 'blocker' || /block/.test(n))) return 'photo-blocker';
  if (isImg && parentKind === 'work') return 'photo-work';
  if (isImg) return 'image';
  return 'ignore';
}


/* What a picture is, judged from the text read out of it. Returns headcount | dabs | welder | photo */
function classifyImageText(text) {
  var t = String(text || '').toLowerCase().replace(/\s+/g, ' ');
  var tradeWords = ['rigger', 'plater', 'scaffolder', 'welder', 'fitter', 'pwht', 'fire watcher', 'materials controller', 'chargehand', 'staff', 'operative', 'labourer', 'electrician'];
  var trades = tradeWords.filter(function (w) { return t.indexOf(w) >= 0; }).length;
  if ((/total/.test(t) && trades >= 3) || (/head\s?count/.test(t) && trades >= 2)) return 'headcount';
  var dabsWords = ['activity description', 'activity desc', 'remark', 'blocker', 'not done', 'ongoing', 'tag no', 'dabs', 'night added'];
  var dh = dabsWords.filter(function (w) { return t.indexOf(w) >= 0; }).length;
  if (dh >= 3) return 'dabs';
  var weldWords = ['welder', 'distribution', 'welding', 'fit up', 'fit-up', 'fitup', 'spool', 'support', 'ready to weld', 'inspection', 'completed', 'night shift', 'weld'];
  var wh = weldWords.filter(function (w) { return t.indexOf(w) >= 0; }).length;
  var weldHits = (t.match(/we[l1i]d|wel0|spoo[l1]|fit ?up/g) || []).length;
  if (wh >= 3 || (/welder|distribution/.test(t) && wh >= 2) || weldHits >= 3) return 'welder';
  return 'photo';
}

function photoCaption(name) {
  return String(name || '').replace(/\.[a-z0-9]+$/i, '').replace(/^(blockers?|work|photo)[\s_\-]*/i, '').replace(/[_]+/g, ' ').trim();
}

function isFallback(j) { return /[fg]a[l1i]{1,2}\w{0,2}ack/i.test((j.act || '') + ' ' + (j.remark || '') + ' ' + (j.tag || '')); }

function calcSummary(jobs) {
  var r = { total: 0, done: 0, ongoing: 0, notdone: 0, acts: {}, blockers: {}, night: { total: 0, done: 0, ongoing: 0, notdone: 0 } };
  (jobs || []).forEach(function (j) {
    /* A fallback job that was not done is not counted as a task at all */
    if (isFallback(j) && j.status === STATUS.NOTDONE) { r.skippedFallback = (r.skippedFallback || 0) + 1; return; }
    r.total++;
    var key = j.status === STATUS.DONE ? 'done' : j.status === STATUS.ONGOING ? 'ongoing' : 'notdone';
    r[key]++;
    if (j.night) { r.night.total++; r.night[key]++; }
    var a = r.acts[j.cat] || (r.acts[j.cat] = { done: 0, ongoing: 0, notdone: 0 });
    a[key]++;
    var b = blockerCategory(j.remark);
    if (b) r.blockers[b] = (r.blockers[b] || 0) + 1;
  });
  return r;
}

/* Headcount text: lines like "Rigger Chargehand 5", "| Plater | 15 |", "Staff: 7" */
function abbrevTrade(name) {
  var n = String(name || '').replace(/\s+/g, ' ').trim();
  n = n.replace(/chargehands?/ig, 'CH');
  n = n.replace(/fire watcher\s*\/\s*general operative/i, 'FW / Gen Op');
  n = n.replace(/materials controller/i, 'Mat. Controller');
  return n;
}

function parseHeadcount(text) {
  var rows = [], total = null;
  String(text || '').split(/\r?\n/).forEach(function (line) {
    var l = line.replace(/\|/g, ' ').replace(/\t/g, '  ').trim();
    if (!l) return;
    var m = /^(.*?)[\s:]+(\d+)\s*$/.exec(l);
    if (!m) return;
    var name = m[1].trim();
    if (!name || /^-+$/.test(name)) return;
    if (/^(trade|count)$/i.test(name)) return;
    if (/^total$/i.test(name)) { total = parseInt(m[2], 10); return; }
    rows.push({ name: abbrevTrade(name), count: parseInt(m[2], 10) });
  });
  return { rows: rows, total: total };
}

function sumCounts(rows) {
  return (rows || []).reduce(function (s, r) { return s + (parseInt(r.count, 10) || 0); }, 0);
}

function fmtNight(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  if (p.length < 3) return iso;
  var mn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return parseInt(p[2], 10) + ' ' + mn[parseInt(p[1], 10) - 1] + ' ' + p[0];
}

function shortDate(iso) {
  var p = (iso || '').split('-');
  return p.length < 3 ? iso : p[2] + '/' + p[1];
}


/* ---------- Report layout (A4 portrait, 794 x 1123 px) ---------- */
var C_DONE = '#2e9e5b', C_ONG = '#e8a317', C_NOT = '#d64545';

var REPORT_CSS = [
  '.rp{box-sizing:border-box;width:794px;height:1123px;padding:34px 38px;background:#fff;color:#1b1b1b;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;position:relative;overflow:hidden}',
  '.rp *{box-sizing:border-box}',
  '.rp .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #d8d8d8;padding-bottom:8px;margin-bottom:14px}',
  '.rp .hd b{font-size:20px;font-weight:600}.rp .hd span{color:#666}',
  '.rp .sec{margin-bottom:20px}',
  '.rp .h{font-size:13px;font-weight:600;margin:0 0 6px}',
  '.rp .kpi{display:grid;grid-template-columns:repeat(4,1fr) 100px 1.35fr;gap:9px;align-items:center}',
  '.rp .tile{border-radius:7px;padding:8px 10px}.rp .tile i{display:block;font-style:normal;font-size:11px}.rp .tile b{font-size:24px;font-weight:600}',
  '.rp table.t{width:100%;table-layout:fixed;border-collapse:collapse;text-align:center}',
  '.rp table.t th{background:#1f3864;color:#fff;font-weight:600;font-size:10.5px;padding:5px 2px;border:1px solid #1b2f55;line-height:1.2}',
  '.rp table.t td{border:1px solid #bdbdbd;padding:7px 2px;font-size:15px;font-weight:600}',
  '.rp table.t .tot{background:#fff2c2}.rp table.t th.tot{background:#f2c94c;color:#3b2d00}',
  '.rp .row{display:grid;grid-template-columns:104px 1fr 50px;gap:8px;align-items:center;margin-bottom:7px}',
  '.rp .bar{display:flex;gap:2px;height:18px;border-radius:4px;overflow:hidden}',
  '.rp .bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:11px}',
  '.rp .two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}',
  '.rp .con{border:1px solid #e6a6a6;background:#fdeeee;border-radius:7px;padding:10px 12px;line-height:1.6;align-self:start}',
  '.rp .con b{color:#a32525}',
  '.rp .photos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}',
  '.rp .ph{height:195px;border-radius:7px;background:#f0f0f0 center/cover no-repeat}',
  '.rp .cap{font-size:11px;color:#555;margin-top:3px;line-height:1.3}',
  '.rp .leg{display:flex;gap:14px;color:#555;font-size:11px;margin-top:4px}',
  '.rp .leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}',
  '.rp .pf{position:absolute;left:38px;right:38px;bottom:16px;display:flex;justify-content:space-between;color:#999;font-size:10px}'
].join('\n');

function donutSvg(s) {
  var tot = s.total || 1, circ = 251.33, off = 0, parts = '';
  [['done', C_DONE], ['ongoing', C_ONG], ['notdone', C_NOT]].forEach(function (p) {
    var len = s[p[0]] / tot * circ;
    if (len > 0) parts += '<circle cx="60" cy="60" r="40" fill="none" stroke="' + p[1] + '" stroke-width="16" stroke-dasharray="' + len.toFixed(2) + ' ' + circ + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 60 60)"/>';
    off += len;
  });
  if (!s.total) parts = '<circle cx="60" cy="60" r="40" fill="none" stroke="#e5e5e5" stroke-width="16"/>';
  return '<svg viewBox="0 0 120 120" width="96" height="96">' + parts + '<text x="60" y="67" text-anchor="middle" font-size="24" font-weight="600" fill="#1b1b1b">' + s.total + '</text></svg>';
}

function blockerBars(s) {
  var keys = Object.keys(s.blockers).sort(function (a, b) { return s.blockers[b] - s.blockers[a]; });
  if (!keys.length) return '<div style="color:#888;font-size:11px">No blockers recorded</div>';
  var max = s.blockers[keys[0]];
  return '<div style="font-size:11px;font-weight:600;margin-bottom:4px">Why jobs were not completed</div>' +
    keys.slice(0, 5).map(function (k) {
      var n = s.blockers[k];
      var col = k === 'Manpower' ? C_NOT : C_ONG;
      return '<div style="display:grid;grid-template-columns:78px 1fr 16px;gap:6px;align-items:center;margin-bottom:4px;font-size:11px"><span style="color:#555">' + esc(k) + '</span><div style="background:#eee;height:10px;border-radius:3px"><div style="width:' + Math.round(n / max * 100) + '%;height:10px;background:' + col + ';border-radius:3px"></div></div><b>' + n + '</b></div>';
    }).join('');
}

/* history: [{date, headcount}] other nights; current night added here */
function trendSvg(history, curDate, curTotal) {
  var pts = (history || []).filter(function (h) { return h.date !== curDate && h.date < curDate; });
  pts = pts.concat([{ date: curDate, headcount: curTotal }]).sort(function (a, b) { return a.date < b.date ? -1 : 1; }).slice(-14);
  if (pts.length < 2) return '<div style="font-size:10px;color:#999;text-align:right;padding-top:12px">Trend appears after the second saved night</div>';
  var W = 250, H = 58, base = 46, bw = W / pts.length, max = Math.max.apply(null, pts.map(function (p) { return p.headcount; })) || 1;
  var bars = pts.map(function (p, i) {
    var h = Math.max(2, Math.round(p.headcount / max * 30)), cur = p.date === curDate, cx = (i * bw + bw / 2).toFixed(1);
    return '<rect x="' + (i * bw + 2).toFixed(1) + '" y="' + (base - h) + '" width="' + (bw - 4).toFixed(1) + '" height="' + h + '" rx="2" fill="' + (cur ? '#1f3864' : '#b9c4d9') + '"/>' +
      (cur || i === 0 ? '<text x="' + cx + '" y="' + (base - h - 3) + '" text-anchor="middle" font-size="9" fill="#333">' + p.headcount + '</text>' : '') +
      (i === 0 || cur ? '<text x="' + (i === 0 ? 1 : W - 1) + '" y="56" text-anchor="' + (i === 0 ? 'start' : 'end') + '" font-size="8.5" fill="#777">' + shortDate(p.date) + '</text>' : '');
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' + bars + '</svg>';
}

function trendLabel(history, date) {
  var n = Math.min(14, (history || []).filter(function (h) { return h.date < date; }).length + 1);
  return n < 2 ? '' : 'Headcount, last ' + n + ' nights';
}

function headcountTable(rows) {
  var total = sumCounts(rows);
  if (!rows.length) return '<div style="color:#888">No headcount entered</div>';
  return '<table class="t"><tr>' + rows.map(function (r) { return '<th>' + esc(r.name) + '</th>'; }).join('') + '<th class="tot">TOTAL</th></tr><tr>' +
    rows.map(function (r) { return '<td>' + (parseInt(r.count, 10) || 0) + '</td>'; }).join('') + '<td class="tot">' + total + '</td></tr></table>';
}

function welderTable(w) {
  w = w || {};
  var cols = [['Welding support', w.ws], ['Welding spool', w.wsp], ['Fit-up support', w.fs], ['Fit-up spool', w.fsp], ['CH', w.ch]];
  var tot = cols.reduce(function (s, c) { return s + (parseInt(c[1], 10) || 0); }, 0);
  return '<table class="t"><tr>' + cols.map(function (c) { return '<th>' + c[0] + '</th>'; }).join('') + '<th class="tot">TOTAL</th></tr><tr>' +
    cols.map(function (c) { return '<td>' + (parseInt(c[1], 10) || 0) + '</td>'; }).join('') + '<td class="tot">' + tot + '</td></tr></table>';
}

function activityBars(s) {
  var names = ACT_ORDER.filter(function (n) { return s.acts[n]; });
  if (!names.length) return '<div style="color:#888">No DABS loaded</div>';
  var max = Math.max.apply(null, names.map(function (n) { var a = s.acts[n]; return a.done + a.ongoing + a.notdone; }));
  var rows = names.map(function (n) {
    var a = s.acts[n], t = a.done + a.ongoing + a.notdone, segs = '';
    [['done', C_DONE], ['ongoing', C_ONG], ['notdone', C_NOT]].forEach(function (p) {
      if (a[p[0]]) segs += '<div style="flex:' + a[p[0]] + ';background:' + p[1] + '">' + a[p[0]] + '</div>';
    });
    return '<div class="row"><span>' + n + '</span><div class="bar" style="width:' + Math.max(14, Math.round(t / max * 100)) + '%">' + segs + '</div><span style="color:#666">' + t + (t === 1 ? ' job' : ' jobs') + '</span></div>';
  }).join('');
  var legend = '<div class="leg"><span><i style="background:' + C_DONE + '"></i>Done</span><span><i style="background:' + C_ONG + '"></i>Ongoing</span><span><i style="background:' + C_NOT + '"></i>Not done</span></div>';
  var night = s.night.total ? '<div style="color:#555;font-size:11px;margin-top:6px">Night added: ' + s.night.total + ' job' + (s.night.total === 1 ? '' : 's') + ' (' + [s.night.done ? s.night.done + ' done' : '', s.night.ongoing ? s.night.ongoing + ' ongoing' : '', s.night.notdone ? s.night.notdone + ' not done' : ''].filter(Boolean).join(', ') + ')</div>' : '';
  return rows + legend + night;
}

function photoCell(p, h) {
  var col = p.kind === 'blocker' ? '#d64545' : '#2e9e5b';
  var lab = p.kind === 'blocker' ? 'Blocker' : 'Done';
  return '<div><div class="ph" style="' + (h ? 'height:' + h + 'px;' : '') + 'border:2px solid ' + col + ';background-image:url(\'' + p.url + '\')"></div><div class="cap"><b style="color:' + col + '">' + lab + '</b>' + (p.caption ? ' · ' + esc(p.caption) : '') + '</div></div>';
}

function pageHeader(d, suffix) {
  return '<div class="hd"><div><b>' + esc(d.title || 'Night shift report') + '</b> <span>· Night of ' + fmtNight(d.date) + (suffix || '') + '</span></div></div>';
}

/* Returns array of page HTML strings. Page footer numbers filled in here. */
function buildReportPages(d, history) {
  var s = calcSummary((d.dabs && d.dabs.jobs) || []);
  var rows = d.headcount || [];
  var total = sumCounts(rows);
  var photos = d.photos || [];
  var concerns = (d.concerns || []).filter(function (c) { return (c.text || '').trim(); });

  var conHtml = concerns.length
    ? '<div class="con"><b>Concerns</b><br>' + concerns.map(function (c) { return esc(c.trade) + ': ' + esc(c.text); }).join('<br>') + '</div>'
    : '<div class="con" style="background:#f3f7f3;border-color:#cfe3d2"><b style="color:#2e7d4a">Concerns</b><br>None reported</div>';

  var main = '<div class="rp">' + pageHeader(d) +
    '<div class="sec kpi">' +
      '<div class="tile" style="background:#f0f0f0"><i style="color:#555">Headcount</i><b>' + total + '</b></div>' +
      '<div class="tile" style="background:#e3f4ea"><i style="color:#1d7a43">Done</i><b style="color:#1d7a43">' + s.done + '</b></div>' +
      '<div class="tile" style="background:#fdf3d6"><i style="color:#8a5a00">Ongoing</i><b style="color:#8a5a00">' + s.ongoing + '</b></div>' +
      '<div class="tile" style="background:#fbe4e4"><i style="color:#a32525">Not done</i><b style="color:#a32525">' + s.notdone + '</b></div>' +
      '<div>' + donutSvg(s) + '</div>' +
      '<div>' + blockerBars(s) + '</div>' +
    '</div>' +
    '<div class="sec" style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:flex-end"><div class="h" style="margin:0">Headcount</div><div style="text-align:right"><div style="font-size:10px;color:#777;margin-bottom:1px">' + trendLabel(history, d.date) + '</div>' + trendSvg(history, d.date, total) + '</div></div>' + headcountTable(rows) + '</div>' +
    '<div class="sec"><div class="h">Welder distribution</div>' + welderTable(d.welders) + '</div>' +
    '<div class="sec two"><div><div class="h">Work status by activity</div>' + activityBars(s) + '</div>' + conHtml + '</div>' +
    '<div class="sec"><div class="h">Photos</div>' + (photos.length ? '<div class="photos">' + photos.slice(0, 4).map(function (p) { return photoCell(p); }).join('') + '</div>' : '<div style="color:#888">No photos added</div>') + '</div>' +
    '</div>';

  var pages = [main];
  for (var i = 4; i < photos.length; i += 8) {
    pages.push('<div class="rp">' + pageHeader(d, ' · photos') + '<div class="photos" style="grid-template-columns:repeat(2,1fr);gap:14px">' +
      photos.slice(i, i + 8).map(function (p) { return photoCell(p, 225); }).join('') + '</div></div>');
  }
  var n = pages.length;
  return pages.map(function (p, idx) {
    return p.replace(/<\/div>$/, '<div class="pf"><span>Generated by Night Report</span><span>' + (idx + 1) + ' / ' + n + '</span></div></div>');
  });
}

/* ---------- Headcount picture reader (table grid + per-cell OCR) ---------- */
function loadImg(src) {
  return new Promise(function (res, rej) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { rej(new Error('Could not open image')); }; im.src = src; });
}

async function grayOf(src) {
  var im = await loadImg(src);
  var c = document.createElement('canvas');
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  var x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(im, 0, 0);
  var d = x.getImageData(0, 0, c.width, c.height).data, g = new Uint8Array(c.width * c.height);
  for (var i = 0; i < g.length; i++) g[i] = (d[4 * i] * 0.299 + d[4 * i + 1] * 0.587 + d[4 * i + 2] * 0.114) | 0;
  return { w: c.width, h: c.height, g: g };
}

function runGroups(flags) {
  var out = [], s = -1;
  for (var i = 0; i <= flags.length; i++) {
    if (i < flags.length && flags[i]) { if (s < 0) s = i; }
    else if (s >= 0) { out.push({ s: s, e: i - 1 }); s = -1; }
  }
  return out;
}

function findGrid(img) {
  var W = img.w, H = img.h, g = img.g, y, x;
  var rowFlag = new Array(H);
  for (y = 0; y < H; y++) { var n = 0; for (x = 0; x < W; x++) if (g[y * W + x] < 110) n++; rowFlag[y] = n > 0.6 * W; }
  var hl = runGroups(rowFlag);
  if (hl.length < 4) return null;
  var y0 = hl[0].s, y1 = hl[hl.length - 1].e, colFlag = new Array(W);
  for (x = 0; x < W; x++) { var m = 0; for (y = y0; y <= y1; y++) if (g[y * W + x] < 110) m++; colFlag[x] = m > 0.5 * (y1 - y0 + 1); }
  var vl = runGroups(colFlag);
  if (vl.length < 3) return null;
  return { hl: hl, vl: vl };
}

/* Crop a region, trim to the ink, binarise, scale up and pad with white (what the OCR engine likes). */
function cellCanvas(img, x0, y0, x1, y1, th, sc) {
  var W = img.w, g = img.g, minX = 1e9, minY = 1e9, maxX = -1, maxY = -1, x, y;
  for (y = y0; y <= y1; y++) for (x = x0; x <= x1; x++) if (g[y * W + x] < th) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  if (maxX < 0) return null;
  minX = Math.max(x0, minX - 6); minY = Math.max(y0, minY - 6); maxX = Math.min(x1, maxX + 6); maxY = Math.min(y1, maxY + 6);
  var w = maxX - minX + 1, h = maxY - minY + 1;
  var t = document.createElement('canvas'); t.width = w; t.height = h;
  var tc = t.getContext('2d'), id = tc.createImageData(w, h);
  for (y = 0; y < h; y++) for (x = 0; x < w; x++) { var v = g[(minY + y) * W + minX + x] > th ? 255 : 0, k = 4 * (y * w + x); id.data[k] = id.data[k + 1] = id.data[k + 2] = v; id.data[k + 3] = 255; }
  tc.putImageData(id, 0, 0);
  var o = document.createElement('canvas'); o.width = (w + 60) * sc; o.height = (h + 60) * sc;
  var oc = o.getContext('2d'); oc.fillStyle = '#fff'; oc.fillRect(0, 0, o.width, o.height);
  oc.imageSmoothingEnabled = true; oc.drawImage(t, 30 * sc, 30 * sc, w * sc, h * sc);
  return o;
}

async function voteDigits(img, x0, y0, x1, y1, rec) {
  var isNum = function (s) { return /^\d{1,3}$/.test(s); };
  var first = [];
  var combos1 = [[140, 3, 7], [170, 3, 7]];
  for (var i = 0; i < combos1.length; i++) {
    var c = cellCanvas(img, x0, y0, x1, y1, combos1[i][0], combos1[i][1]);
    if (!c) return null;
    var r = (await rec(c, { digits: true, psm: combos1[i][2] })).replace(/\s+/g, '');
    first.push(r);
  }
  if (isNum(first[0]) && first[0] === first[1]) return { value: parseInt(first[0], 10), sure: true };
  var votes = {};
  first.forEach(function (r) { if (isNum(r)) votes[r] = (votes[r] || 0) + 1; });
  var ths = [110, 140, 170, 200], scs = [2, 3, 4], psms = [7, 10];
  for (var a = 0; a < ths.length; a++) for (var b = 0; b < scs.length; b++) for (var d = 0; d < psms.length; d++) {
    var cv = cellCanvas(img, x0, y0, x1, y1, ths[a], scs[b]);
    if (!cv) continue;
    var t = (await rec(cv, { digits: true, psm: psms[d] })).replace(/\s+/g, '');
    if (isNum(t)) votes[t] = (votes[t] || 0) + 1;
  }
  var keys = Object.keys(votes).sort(function (p, q) { return votes[q] - votes[p]; });
  if (!keys.length) return { value: null, sure: false };
  var top = votes[keys[0]], second = keys.length > 1 ? votes[keys[1]] : 0;
  return { value: parseInt(keys[0], 10), sure: top >= 6 && top >= 2 * second };
}

/* rec(canvas, {digits, psm}) -> text. Returns {rows:[{name,count,unsure}], total, sum, ok, note} */
async function readHeadcountImage(src, rec, progress) {
  var img = await grayOf(src), grid = findGrid(img);
  if (!grid) return { rows: [], total: null, sum: 0, ok: false, note: 'Could not find the table grid in the picture.' };
  var hl = grid.hl, vl = grid.vl, rows = [], total = null;
  var lx0 = vl[0].e + 4, lx1 = vl[1].s - 4, cx0 = vl[1].e + 4, cx1 = vl[2].s - 4;
  for (var i = 0; i < hl.length - 1; i++) {
    var y0 = hl[i].e + 3, y1 = hl[i + 1].s - 2;
    if (y1 - y0 < 10) continue;
    if (progress) progress(i + 1, hl.length - 1);
    var lc = cellCanvas(img, lx0, y0, lx1, y1, 140, 3);
    if (!lc) continue;
    var label = (await rec(lc, { digits: false, psm: 7 })).replace(/^[^A-Za-z]+/, '').replace(/[^A-Za-z0-9)./]+$/, '').replace(/\s+/g, ' ').trim();
    if (!label) continue;
    var v = await voteDigits(img, cx0, y0, cx1, y1, rec);
    if (/^total/i.test(label)) { total = v && v.value != null ? v.value : null; continue; }
    rows.push({ name: abbrevTrade(label), count: v && v.value != null ? v.value : 0, unsure: !v || !v.sure });
  }
  var missing = rows.filter(function (r) { return r.unsure; });
  var sum = sumCounts(rows);
  var note = '';
  if (total != null && sum !== total) {
    if (missing.length === 1) { missing[0].count = Math.max(0, missing[0].count + (total - sum)); sum = sumCounts(rows); note = 'One number was unclear; it was worked out from the TOTAL row.'; }
  }
  return { rows: rows, total: total, sum: sum, ok: total != null && sum === total, note: note };
}

/* tesseract.js recognizer (loaded from the CDN script in the page) */
var _tw = {};
async function tessRec(canvas, opt) {
  var key = opt.digits ? 'digits' : 'text';
  if (!_tw[key]) {
    _tw[key] = await Tesseract.createWorker('eng');
    if (opt.digits) await _tw[key].setParameters({ tessedit_char_whitelist: '0123456789' });
  }
  await _tw[key].setParameters({ tessedit_pageseg_mode: String(opt.psm || 7) });
  var r = await _tw[key].recognize(canvas);
  return (r.data.text || '').trim();
}

/* Page text with the engine's own page layout (psm 6 for tables) */
async function tessPage(canvas, opt) {
  if (!_tw.page) _tw.page = await Tesseract.createWorker('eng');
  await _tw.page.setParameters({ tessedit_pageseg_mode: String(opt.psm || 6) });
  var r = await _tw.page.recognize(canvas);
  return (r.data.text || '').trim();
}

/* Words with positions (sparse text mode keeps table cells apart) */
async function tessWords(canvas) {
  if (!_tw.sparse) _tw.sparse = await Tesseract.createWorker('eng');
  await _tw.sparse.setParameters({ tessedit_pageseg_mode: '11' });
  var r = await _tw.sparse.recognize(canvas, {}, { tsv: true, text: true, blocks: true });
  var words = r.data.words && r.data.words.length ? r.data.words.map(function (w) { return { t: w.text, x0: w.bbox.x0, y0: w.bbox.y0, x1: w.bbox.x1, y1: w.bbox.y1 }; }) : parseTsvWords(r.data.tsv);
  return words.filter(function (w) { return String(w.t).trim(); });
}

/* ---------- Reading pictures by content: what is it, and DABS screenshots ---------- */

/* tesseract TSV -> [{t,x0,y0,x1,y1}] */
function parseTsvWords(tsv) {
  var out = [];
  String(tsv || '').split(/\r?\n/).forEach(function (l) {
    var c = l.split('\t');
    if (c.length < 12 || c[0] === 'level' || c[0] !== '5') return;
    var t = c.slice(11).join('\t').trim();
    if (!t) return;
    var x = +c[6], y = +c[7], w = +c[8], h = +c[9];
    out.push({ t: t, x0: x, y0: y, x1: x + w, y1: y + h });
  });
  return out;
}

/* A page of text (paper, screenshot, table) is mostly light and uncoloured; a site photo is not. */
async function looksLikeDocument(src) {
  var im = await loadImg(src), s = 160 / Math.max(im.naturalWidth, im.naturalHeight);
  var c = document.createElement('canvas');
  c.width = Math.max(8, Math.round(im.naturalWidth * s)); c.height = Math.max(8, Math.round(im.naturalHeight * s));
  var x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
  var d = x.getImageData(0, 0, c.width, c.height).data, light = 0, n = c.width * c.height;
  for (var i = 0; i < n; i++) {
    var r = d[4 * i], g = d[4 * i + 1], b = d[4 * i + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (mn > 175 && mx - mn < 45) light++;
  }
  return light / n > 0.15;
}

function scaledCanvas(src, maxW, rot) {
  return loadImg(src).then(function (im) {
    var w = im.naturalWidth, h = im.naturalHeight, sc = Math.min(2.5, Math.max(0.5, maxW / Math.max(w, h)));
    if (rot) { var t = w; w = h; h = t; }
    var c = document.createElement('canvas');
    c.width = Math.round(w * sc); c.height = Math.round(h * sc);
    var x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    if (rot) { x.translate(c.width / 2, c.height / 2); x.rotate(rot * Math.PI / 180); x.drawImage(im, -im.naturalWidth * sc / 2, -im.naturalHeight * sc / 2, im.naturalWidth * sc, im.naturalHeight * sc); }
    else x.drawImage(im, 0, 0, c.width, c.height);
    return c;
  });
}

/* Looks at the whole picture and returns {kind, rot}. kind: headcount | dabs | welder | photo */
async function classifyImage(src, rec) {
  if (!(await looksLikeDocument(src))) return { kind: 'photo', rot: 0 };
  var rots = [0, 90, 270];
  for (var i = 0; i < rots.length; i++) {
    var cv = await scaledCanvas(src, 1800, rots[i]);
    var txt = await rec(cv, { digits: false, psm: 6 });
    var k = classifyImageText(txt);
    if (k !== 'photo') return { kind: k, rot: rots[i] };
    /* readable upright text that matches nothing: stop turning it */
    var words = (txt.match(/[A-Za-z]{4,}/g) || []).length;
    if (i === 0 && words > 40) break;
  }
  return { kind: 'photo', rot: 0 };
}

/* Coloured status cells (red = NOT DONE, green, amber) found by colour, then read by their words. */
function statusFromText(t) {
  var u = String(t || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (!u) return '';
  if (/NOT|NOTD|OTDO/.test(u)) return STATUS.NOTDONE;
  if (/ONG|GOI|NGO|OING|ING$/.test(u)) return STATUS.ONGOING;
  if (/DONE|DON|ONE/.test(u)) return STATUS.DONE;
  return '';
}

function tintComponents(cv) {
  var W = cv.width, H = cv.height, d = cv.getContext('2d').getImageData(0, 0, W, H).data, B = 4;
  var gw = Math.ceil(W / B), gh = Math.ceil(H / B), on = new Uint8Array(gw * gh), pink = new Uint32Array(gw * gh);
  for (var by = 0; by < gh; by++) for (var bx = 0; bx < gw; bx++) {
    var cnt = 0, tot = 0, pk = 0;
    for (var y = by * B; y < Math.min(H, by * B + B); y++) for (var x = bx * B; x < Math.min(W, bx * B + B); x++) {
      var k = 4 * (y * W + x), r = d[k], g = d[k + 1], b = d[k + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      tot++;
      if (mn >= 140 && mx - mn >= 22) { cnt++; if (r > g + 25) pk++; }
    }
    on[by * gw + bx] = cnt >= 0.3 * tot ? 1 : 0;
    pink[by * gw + bx] = pk >= 0.5 * cnt ? 1 : 0;
  }
  var seen = new Uint8Array(gw * gh), comps = [];
  for (var s = 0; s < on.length; s++) {
    if (!on[s] || seen[s]) continue;
    var st = [s], minX = gw, minY = gh, maxX = -1, maxY = -1, area = 0, pkc = 0;
    seen[s] = 1;
    while (st.length) {
      var p = st.pop(), px = p % gw, py = (p - px) / gw;
      area++; pkc += pink[p];
      if (px < minX) minX = px; if (px > maxX) maxX = px; if (py < minY) minY = py; if (py > maxY) maxY = py;
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (o) {
        var nx = px + o[0], ny = py + o[1];
        if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) return;
        var q = ny * gw + nx;
        if (on[q] && !seen[q]) { seen[q] = 1; st.push(q); }
      });
    }
    var bw = (maxX - minX + 1), bh = (maxY - minY + 1);
    if (area < 0.55 * bw * bh) continue;
    comps.push({ x0: minX * B, y0: minY * B, x1: (maxX + 1) * B, y1: (maxY + 1) * B, pink: pkc > 0.5 * area });
  }
  return comps;
}

/* Neighbouring cells share one coloured block; cut it at the dark horizontal grid lines. */
function splitAtLines(cv, comps) {
  var W = cv.width, ctx = cv.getContext('2d'), out = [];
  comps.forEach(function (c) {
    var w = c.x1 - c.x0, h = c.y1 - c.y0;
    if (w < 4 || h < 4) return;
    var d = ctx.getImageData(c.x0, c.y0, w, h).data, cuts = [];
    for (var y = 0; y < h; y++) {
      var dark = 0;
      for (var x = 0; x < w; x++) { var k = 4 * (y * w + x); if (d[k] + d[k + 1] + d[k + 2] < 330) dark++; }
      if (dark > 0.55 * w) cuts.push(y);
    }
    var start = 0, prev = -2;
    cuts.forEach(function (y) { if (y !== prev + 1) { if (y - 1 >= start) out.push({ x0: c.x0, x1: c.x1, y0: c.y0 + start, y1: c.y0 + y, pink: c.pink }); } prev = y; if (y >= start) start = y + 1; });
    if (h - 1 >= start) out.push({ x0: c.x0, x1: c.x1, y0: c.y0 + start, y1: c.y1, pink: c.pink });
  });
  return out;
}

function grayFromCanvas(cv) {
  var W = cv.width, H = cv.height, d = cv.getContext('2d').getImageData(0, 0, W, H).data, g = new Uint8Array(W * H);
  for (var i = 0; i < g.length; i++) g[i] = (d[4 * i] * 0.299 + d[4 * i + 1] * 0.587 + d[4 * i + 2] * 0.114) | 0;
  return { w: W, h: H, g: g };
}

/* x positions of dark vertical grid lines inside a horizontal strip */
function verticalLines(gray, y0, y1) {
  var W = gray.w, g = gray.g, flags = [], h = y1 - y0 + 1;
  for (var x = 0; x < W; x++) {
    var n = 0;
    for (var y = y0; y <= y1; y++) if (g[y * W + x] < 120) n++;
    flags.push(n > 0.75 * h);
  }
  return runGroups(flags).map(function (r) { return (r.s + r.e) >> 1; });
}

async function readCell(gray, x0, y0, x1, y1, rec, psm, th) {
  if (x1 - x0 < 6 || y1 - y0 < 4) return '';
  var cv = cellCanvas(gray, Math.round(x0), Math.round(y0), Math.round(x1), Math.round(y1), th || 160, 3);
  if (!cv) return '';
  return (await rec(cv, { digits: false, psm: psm || 7 })).replace(/\s+/g, ' ').trim();
}

/* rec(canvas,{psm}) -> text; recWords(canvas) -> [{t,x0,y0,x1,y1}] (only used to find the section titles) */
async function readDabsImage(src, rec, recWords, rot, refYear, progress, prevTitle) {
  var warnings = [];
  var cv = await scaledCanvas(src, 2400, rot || 0);
  var im = await loadImg(src);
  var sc = cv.width / ((rot === 90 || rot === 270) ? im.naturalHeight : im.naturalWidth);
  var minW = 22 * sc, minH = 8 * sc;
  var gray = grayFromCanvas(cv);
  var rgb = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
  var isPink = function (c) {
    var pk = 0, tn = 0;
    for (var y = c.y0; y < c.y1; y += 2) for (var x = c.x0; x < c.x1; x += 2) {
      var k = 4 * (y * cv.width + x), r = rgb[k], g = rgb[k + 1], b = rgb[k + 2];
      if (Math.min(r, g, b) >= 140 && Math.max(r, g, b) - Math.min(r, g, b) >= 22) { tn++; if (r > g + 25) pk++; }
    }
    return tn > 0 && pk > 0.5 * tn;
  };
  var comps = splitAtLines(cv, tintComponents(cv).filter(function (c) { return c.x1 - c.x0 >= minW && c.y1 - c.y0 >= minH; })).filter(function (c) { return c.y1 - c.y0 >= minH; });
  var words = await recWords(cv);
  var sorted = words.slice().sort(function (a, b) { return (a.y0 + a.y1) - (b.y0 + b.y1); });
  var lines = [];
  sorted.forEach(function (w) {
    var cy = (w.y0 + w.y1) / 2, ln = lines[lines.length - 1];
    if (ln && Math.abs(cy - ln.cy) < 6 * sc) { ln.w.push(w); ln.cy = (ln.cy * (ln.w.length - 1) + cy) / ln.w.length; }
    else lines.push({ cy: cy, w: [w] });
  });
  lines.forEach(function (l) { l.w.sort(function (a, b) { return a.x0 - b.x0; }); l.text = l.w.map(function (w) { return w.t; }).join(' '); });
  var titles = lines.filter(function (l) { return /dabs/i.test(l.text) && /(support|spool)/i.test(l.text) && !/activity/i.test(l.text); })
    .map(function (l) { return { y: l.cy, night: /added/i.test(l.text), kind: /spool/i.test(l.text) ? 'spool' : 'support', text: l.text }; });
  if (!titles.length) warnings.push('No "DABS Support / Spool" titles were read in the picture.');
  var night = '';
  titles.forEach(function (t) { if (!night) night = detectNight(t.text, refYear); });
  /* the real status cells are the widest coloured blocks; small blobs are coloured text */
  var wmax = comps.reduce(function (m, c) { return Math.max(m, c.x1 - c.x0); }, 0);
  comps.forEach(function (c) { c.pink = isPink(c); });
  comps = comps.filter(function (c) { return c.x1 - c.x0 >= 0.7 * wmax && c.y1 - c.y0 >= 11 * sc; });
  comps.sort(function (a, b) { return a.y0 - b.y0 || a.x0 - b.x0; });
  var firstStatusX = comps.reduce(function (m, c) { return Math.min(m, c.x0); }, 1e9);
  var jobs = [], skipped = 0;
  for (var ci = 0; ci < comps.length; ci++) {
    var c = comps[ci];
    if (progress) progress(ci + 1, comps.length);
    var mid = (c.y0 + c.y1) >> 1, pad = Math.max(2, Math.round(2 * sc));
    var y0 = c.y0 + pad, y1 = c.y1 - pad;
    var st = await readCell(gray, c.x0 + pad, y0, c.x1 - pad, y1, rec, 6, 170);
    var status = c.pink ? STATUS.NOTDONE : statusFromText(st);
    if (!status) { skipped++; continue; }
    var vl = verticalLines(gray, y0, y1);
    var near = function (x) { return vl.filter(function (v) { return Math.abs(v - x) < 6 * sc; })[0]; };
    var actR = near(firstStatusX) != null ? near(firstStatusX) : firstStatusX;
    var left = vl.filter(function (v) { return v < actR - 20 * sc; });
    var actL = left.length ? left[left.length - 1] : 0;
    var tagL = left.length > 1 ? left[left.length - 2] : actL;
    var rightLines = vl.filter(function (v) { return v > c.x1; });
    var remL = rightLines.length >= 2 ? rightLines[rightLines.length - 2] : c.x1;
    var remR = rightLines.length ? rightLines[rightLines.length - 1] : gray.w - 2;
    var act = await readCell(gray, actL + 4, y0, actR - 3, y1, rec, 6, 160);
    var tag = await readCell(gray, tagL + 4, y0, actL - 3, y1, rec, 6, 160);
    var remark = await readCell(gray, remL + 4, y0, remR - 3, y1, rec, 6, 160);
    var title = prevTitle || null;
    titles.forEach(function (t) { if (t.y < c.y0) title = t; });
    var job = { kind: title ? title.kind : 'support', night: title ? title.night : false, level: '', tag: tag, act: act, status: status, remark: remark };
    job.cat = classifyActivity(job);
    jobs.push(job);
  }
  if (skipped) warnings.push(skipped + ' coloured cell(s) in the picture could not be read as DONE / ONGOING / NOT DONE.');
  if (jobs.length) warnings.push('Jobs were counted from a picture, not from the Excel file. Check the counts on the Review screen.');
  return { jobs: jobs, night: night, warnings: warnings, lastTitle: titles.length ? titles[titles.length - 1] : prevTitle };
}

/* ---------- Welding sheet: count welders per duty from the handwritten "Duty" column ---------- */
function weldTokKind(t) {
  var s = String(t || '').replace(/[^A-Za-z0-9$]/g, '');
  if (!s) return '';
  var u = s.toUpperCase();
  if (/CHARG|HARGE|EHAND/.test(u)) return 'ch';
  if (/^(F[I1L!T]{1,2}T?|FIR|FT|FTT)$/.test(u) || /^F[I1]T/.test(u)) return 'fit';
  if (/^U[PB]$/.test(u)) return 'up';
  if (u.length >= 4 && /PP|POR|ORT|PRT|UPO/.test(u)) return 'support';
  if (u.length >= 3 && (/^[S5$8][PB]/.test(u) || /P[O0]{1,2}[L1]/.test(u) || /^S[O0]{1,2}[L1]$/.test(u))) return 'spool';
  if (u.length >= 5 && (/(EL|LD|ELL|ELP|LDI)/.test(u) || /(ING|INA|IVA|IAG|NG)$/.test(u))) return 'weld';
  return '';
}

/* tokens in reading order -> {ws, wsp, fs, fsp, pairs} */
function countWeldPairs(tokens) {
  var r = { ws: 0, wsp: 0, fs: 0, fsp: 0, pairs: 0, bottoms: 0 }, top = null, bottom = null;
  var flush = function () {
    if (!top) return;
    var fit = bottom === 'fit';
    if (top === 'support') r[fit ? 'fs' : 'ws']++; else r[fit ? 'fsp' : 'wsp']++;
    r.pairs++; if (bottom) r.bottoms++;
    top = null; bottom = null;
  };
  tokens.forEach(function (t) {
    var k = weldTokKind(t);
    if (k === 'support' || k === 'spool') { flush(); top = k; }
    else if (k === 'fit' || k === 'up') { if (top && bottom !== 'weld') bottom = 'fit'; }
    else if (k === 'weld') { if (top && !bottom) bottom = 'weld'; }
  });
  flush();
  return r;
}

/* words of the duty column (where most duty words line up), in reading order */
function dutyColumn(words, W) {
  var hits = words.filter(function (w) { var k = weldTokKind(w.t); return k && k !== 'ch'; });
  if (hits.length < 2) return null;
  var bin = Math.max(20, W * 0.05), best = null;
  hits.forEach(function (h) {
    var cx = (h.x0 + h.x1) / 2;
    var grp = hits.filter(function (o) { var k = weldTokKind(o.t); return (k === 'support' || k === 'spool' || k === 'fit') && Math.abs((o.x0 + o.x1) / 2 - cx) < bin; });
    if (!best || grp.length > best.length) best = grp;
  });
  if (!best || !best.length) return null;
  var x0 = Math.min.apply(null, best.map(function (w) { return w.x0; })) - W * 0.02;
  var x1 = Math.max.apply(null, best.map(function (w) { return w.x1; })) + W * 0.04;
  var col = words.filter(function (w) { var cx = (w.x0 + w.x1) / 2; return cx >= x0 && cx <= x1; });
  var rowH = Math.max(6, (col.reduce(function (a, w) { return a + (w.y1 - w.y0); }, 0) / Math.max(1, col.length)) * 0.6);
  col.sort(function (a, b) { return Math.abs(a.y0 - b.y0) < rowH ? a.x0 - b.x0 : a.y0 - b.y0; });
  return { words: col, x0: Math.max(0, x0), x1: x1, y0: Math.min.apply(null, best.map(function (w) { return w.y0; })), y1: Math.max.apply(null, best.map(function (w) { return w.y1; })) };
}

function scaleCanvas(cv, f) {
  var c = document.createElement('canvas');
  c.width = Math.round(cv.width * f); c.height = Math.round(cv.height * f);
  var x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cv, 0, 0, c.width, c.height);
  return c;
}

/* rec(canvas,{psm}) -> text; recWords(canvas) -> words with boxes. Returns {ws,wsp,fs,fsp,ch,found} */
async function readWelderSheet(src, rec, recWords, rot) {
  var cv = await scaledCanvas(src, 2400, rot || 0), W = cv.width, H = cv.height;
  var results = [], ch = 0, col = null;
  var facs = [1, 1.4];
  for (var i = 0; i < facs.length; i++) {
    var c = facs[i] === 1 ? cv : scaleCanvas(cv, facs[i]);
    var words = await recWords(c);
    ch = Math.max(ch, words.filter(function (w) { return weldTokKind(w.t) === 'ch'; }).length);
    var dc = dutyColumn(words, c.width);
    if (!dc) continue;
    if (!col) col = { x0: dc.x0 / facs[i], x1: dc.x1 / facs[i], y0: dc.y0 / facs[i], y1: dc.y1 / facs[i] };
    results.push(countWeldPairs(dc.words.map(function (w) { return w.t; })));
  }
  if (col) {
    var y0 = Math.max(0, col.y0 - H * 0.03), y1 = Math.min(H - 1, col.y1 + H * 0.06);
    var scales = [1.4, 2];
    for (var j = 0; j < scales.length; j++) {
      var k = document.createElement('canvas');
      k.width = Math.round((col.x1 - col.x0) * scales[j]); k.height = Math.round((y1 - y0) * scales[j]);
      var kx = k.getContext('2d'); kx.fillStyle = '#fff'; kx.fillRect(0, 0, k.width, k.height); kx.imageSmoothingQuality = 'high';
      kx.drawImage(cv, col.x0, y0, col.x1 - col.x0, y1 - y0, 0, 0, k.width, k.height);
      var txt = String(await rec(k, { psm: 6 }));
      ch = Math.max(ch, (txt.match(/charg|harge|ehand/ig) || []).length);
      results.push(countWeldPairs(txt.split(/\s+/)));
    }
  }
  if (!results.length) return { found: false, ws: 0, wsp: 0, fs: 0, fsp: 0, ch: Math.min(ch, 3) };
  /* each pass tends to miss words rather than invent them, so the highest count per duty is kept */
  var r = { ws: 0, wsp: 0, fs: 0, fsp: 0, pairs: 0 };
  results.forEach(function (x) { ['ws', 'wsp', 'fs', 'fsp', 'pairs'].forEach(function (k) { r[k] = Math.max(r[k], x[k]); }); });
  return { found: r.pairs > 0, ws: r.ws, wsp: r.wsp, fs: r.fs, fsp: r.fsp, ch: Math.min(ch, 3), all: results };
}

/* ---------- App: state, Google Drive, screens ---------- */
var SCOPE = 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file';
var ROOT_NAME = 'Night Report - Saved reports';
var XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
var GSHEET_MIME = 'application/vnd.google-apps.spreadsheet';
var FOLDER_MIME = 'application/vnd.google-apps.folder';
var DEFAULT_TRADES = ['Staff', 'Rigger CH', 'Rigger', 'Plater CH', 'Plater', 'Scaffolder', 'Pipe Welder CH', 'Pipe Welder', 'Pipe Fitter', 'PWHT', 'FW / Gen Op', 'Mat. Controller'];
var CONCERN_TRADES = ['Plating', 'Piping', 'Lifting', 'Scaffolding', 'QC', 'All'];
var MAX_PHOTOS = 20;

function freshState() {
  return {
    date: '',
    dabs: { file: '', jobs: [], warnings: [] },
    headcount: DEFAULT_TRADES.map(function (n) { return { name: n, count: 0 }; }),
    welders: { ws: 0, wsp: 0, fs: 0, fsp: 0, ch: 0 },
    concerns: [],
    photos: [],
    removedPhotoIds: [],
    src: { warnings: [] }
  };
}

var S = freshState();
var UI = { view: 'home', signed: false, busy: '', index: [], error: '', loadingIndex: false, nights: [], curNight: null, lastView: '' };

function setting(k, d) { var v = localStorage.getItem('nr_' + k); return v == null ? d : v; }

/* ---------- Auth ---------- */
var tokenClient = null, accessToken = '', tokenExp = 0;

function ensureTokenClient() {
  if (tokenClient) return true;
  var cid = setting('client_id', '');
  if (!cid || !window.google || !google.accounts || !google.accounts.oauth2) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: cid, scope: SCOPE, callback: function () {} });
  return true;
}

function getToken(interactive) {
  return new Promise(function (res, rej) {
    if (accessToken && Date.now() < tokenExp - 60000) return res(accessToken);
    if (!ensureTokenClient()) return rej(new Error('Google sign-in is not ready. Check the Client ID in Settings and reload.'));
    tokenClient.callback = function (r) {
      if (r.error) return rej(new Error(r.error_description || r.error));
      accessToken = r.access_token;
      tokenExp = Date.now() + (r.expires_in || 3600) * 1000;
      localStorage.setItem('nr_signed', '1');
      res(accessToken);
    };
    tokenClient.error_callback = function (e) { rej(new Error((e && e.type) || 'sign_in_cancelled')); };
    tokenClient.requestAccessToken({ prompt: interactive ? '' : 'none' });
  });
}

async function authHeader() {
  var t;
  try { t = await getToken(false); } catch (e) { t = await getToken(true); }
  return { Authorization: 'Bearer ' + t };
}

/* ---------- Drive helpers ---------- */
async function drive(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign(await authHeader(), opts.headers || {});
  var r = await fetch('https://www.googleapis.com/drive/v3/' + path, opts);
  if (!r.ok) {
    var msg = '';
    try { msg = (await r.json()).error.message; } catch (e) { msg = r.statusText; }
    var err = new Error('Drive: ' + msg); err.status = r.status; throw err;
  }
  return r;
}

function qname(n) { return String(n).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

async function listFiles(q) {
  var r = await drive('files?q=' + encodeURIComponent(q) + '&fields=files(id,name,mimeType,createdTime,modifiedTime)&pageSize=500');
  return (await r.json()).files || [];
}
async function listChildren(folderId) { return listFiles("trashed=false and '" + folderId + "' in parents"); }

async function createFolder(name, parent) {
  var r = await drive('files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, mimeType: FOLDER_MIME, parents: [parent || 'root'] }) });
  return (await r.json()).id;
}

async function findOrCreateFolder(name, parent) {
  var f = await listFiles("name='" + qname(name) + "' and mimeType='" + FOLDER_MIME + "' and trashed=false and '" + (parent || 'root') + "' in parents");
  return f.length ? f[0].id : createFolder(name, parent);
}

async function uploadFile(name, blob, mime, parent, existingId) {
  var boundary = 'nrb' + Math.random().toString(36).slice(2);
  var meta = existingId ? { name: name } : { name: name, parents: [parent] };
  var body = new Blob(['--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) + '\r\n--' + boundary + '\r\nContent-Type: ' + mime + '\r\n\r\n', blob, '\r\n--' + boundary + '--']);
  var url = 'https://www.googleapis.com/upload/drive/v3/files' + (existingId ? '/' + existingId : '') + '?uploadType=multipart&fields=id';
  var h = await authHeader();
  h['Content-Type'] = 'multipart/related; boundary=' + boundary;
  var r = await fetch(url, { method: existingId ? 'PATCH' : 'POST', headers: h, body: body });
  if (!r.ok) { var m = ''; try { m = (await r.json()).error.message; } catch (e) { m = r.statusText; } throw new Error('Upload failed: ' + m); }
  return (await r.json()).id;
}

async function downloadBlob(f) {
  if (f.mimeType === GSHEET_MIME) return (await drive('files/' + f.id + '/export?mimeType=' + encodeURIComponent(XLSX_MIME))).blob();
  return (await drive('files/' + f.id + '?alt=media')).blob();
}
async function downloadJson(id) { return (await drive('files/' + id + '?alt=media')).json(); }

function blobToDataUrl(b) {
  return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(fr.result); }; fr.onerror = rej; fr.readAsDataURL(b); });
}

async function ensureRoot() {
  var id = localStorage.getItem('nr_root2');
  if (id) {
    try { var j = await (await drive('files/' + id + '?fields=id,trashed')).json(); if (j.trashed) id = null; } catch (e) { id = null; }
  }
  if (!id) { id = await findOrCreateFolder(ROOT_NAME, null); localStorage.setItem('nr_root2', id); }
  return id;
}

async function readIndex() {
  var root = await ensureRoot();
  var f = await listFiles("name='index.json' and trashed=false and '" + root + "' in parents");
  if (!f.length) return { id: null, list: [], root: root };
  var list = await downloadJson(f[0].id);
  return { id: f[0].id, list: Array.isArray(list) ? list : [], root: root };
}

async function refreshIndex() {
  UI.loadingIndex = true;
  try { UI.index = (await readIndex()).list; UI.error = ''; } catch (e) { UI.error = e.message; }
  UI.loadingIndex = false;
}

/* ---------- The input folder ---------- */
async function resolveInputRoot() {
  var v = (setting('input', '') || '').trim();
  if (!v) throw new Error('Set the Drive input folder in Settings first.');
  var m = /folders\/([-\w]{20,})/.exec(v) || /[?&]id=([-\w]{20,})/.exec(v) || /^([-\w]{25,})$/.exec(v);
  if (m) return m[1];
  var f = await listFiles("name='" + qname(v) + "' and mimeType='" + FOLDER_MIME + "' and trashed=false");
  if (!f.length) throw new Error('Folder "' + v + '" not found in your Drive.');
  return f[0].id;
}

/* Nights = sub-folders named with a date, plus loose files named with a date */
/* Night a loose file belongs to, from when it was put in Drive: before 14:00 counts as the night before */
function shiftNightOf(t) {
  if (!t) return '';
  var d = new Date(t);
  if (isNaN(d)) return '';
  if (d.getHours() < 14) d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

async function listNights() {
  var root = await resolveInputRoot();
  var kids = await listChildren(root), map = {};
  var yr = new Date().getFullYear();
  var get = function (iso) { return map[iso] || (map[iso] = { iso: iso, folderId: null, name: '', files: [] }); };
  kids.forEach(function (k) {
    if (k.mimeType === FOLDER_MIME) {
      var iso = parseDateName(k.name, yr);
      if (!iso) return;
      var n = get(iso); n.folderId = k.id; n.name = k.name;
      return;
    }
    if (/^(index|data)\.json$/i.test(k.name) || /^Night report \d{4}-\d{2}-\d{2}\.pdf$/.test(k.name)) return;
    /* loose files in the main folder: grouped by the night they were uploaded */
    var ni = shiftNightOf(k.createdTime || k.modifiedTime) || parseDateName(k.name, yr);
    if (!ni) return;
    get(ni).files.push(k);
  });
  Object.keys(map).forEach(function (k) {
    var n = map[k];
    if (n.files.length) n.name = n.folderId ? n.name + ' + ' + n.files.length + ' file(s) in the main folder' : n.files.length + ' file(s) in the main folder';
  });
  return Object.keys(map).sort().reverse().map(function (k) { return map[k]; });
}

/* ---------- Reading one night from Drive ---------- */
function compressImage(file) {
  return (async function () {
    var bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { bmp = await createImageBitmap(file); }
    var max = 1280, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    var cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.8);
  })();
}

async function readDabsBlob(blob) {
  var wb = XLSX.read(await blob.arrayBuffer(), { type: 'array' });
  var best = null;
  wb.SheetNames.forEach(function (n) {
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: false });
    var r = parseDabs(rows, new Date().getFullYear());
    if (!best || r.jobs.length > best.jobs.length) best = r;
  });
  return best;
}

async function sheetBlobToText(blob) {
  var wb = XLSX.read(await blob.arrayBuffer(), { type: 'array' });
  var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false });
  return rows.map(function (r) { return r.filter(function (c) { return String(c).trim() !== ''; }).join(' '); }).join('\n');
}

/* cut away the empty page margins so the content fills the picture */
function trimWhite(cv) {
  var W = cv.width, H = cv.height, d = cv.getContext('2d').getImageData(0, 0, W, H).data, x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (var y = 0; y < H; y += 2) for (var x = 0; x < W; x += 2) {
    var k = 4 * (y * W + x);
    if (d[k] < 235 || d[k + 1] < 235 || d[k + 2] < 235) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return cv;
  x0 = Math.max(0, x0 - 12); y0 = Math.max(0, y0 - 12); x1 = Math.min(W - 1, x1 + 12); y1 = Math.min(H - 1, y1 + 12);
  var o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(cv, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return o;
}

async function pdfToImages(blob, maxPages) {
  var doc = await pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
  var urls = [], text = '';
  for (var i = 1; i <= Math.min(doc.numPages, maxPages || 4); i++) {
    var page = await doc.getPage(i);
    var tc = await page.getTextContent();
    var rowsByY = {};
    tc.items.forEach(function (o) { var y = Math.round(o.transform[5] / 3); (rowsByY[y] = rowsByY[y] || []).push(o); });
    Object.keys(rowsByY).map(Number).sort(function (a, b) { return b - a; }).forEach(function (y) {
      text += rowsByY[y].sort(function (a, b) { return a.transform[4] - b.transform[4]; }).map(function (o) { return o.str; }).join('  ') + '\n';
    });
    var vp = page.getViewport({ scale: 1 }), sc = Math.min(4, 3000 / Math.max(vp.width, vp.height));
    var v = page.getViewport({ scale: sc }), cv = document.createElement('canvas');
    cv.width = Math.round(v.width); cv.height = Math.round(v.height);
    var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: cx, viewport: v }).promise;
    urls.push(trimWhite(cv).toDataURL('image/png'));
  }
  return { urls: urls, text: text };
}

async function rotatedUrl(url, rot) {
  var cv = await scaledCanvas(url, 1800, rot);
  return cv.toDataURL('image/jpeg', 0.85);
}

async function pullNight(night, say) {
  var st = freshState();
  st.date = night.iso;
  st.src = { nightIso: night.iso, folderName: night.name, dabsFile: '', hcSource: '', hcCheck: null, hcImg: '', welderImg: '', warnings: [] };
  var warn = function (m) { st.src.warnings.push(m); };

  say('Looking in the Drive folder…');
  var files = (night.folderId ? await listChildren(night.folderId) : []).concat(night.files || []);
  var items = [];
  /* every file in the night folder and in its sub-folders (two levels down) */
  async function gather(list, kind, depth) {
    for (var i = 0; i < list.length; i++) {
      var f = list[i];
      if (f.mimeType === FOLDER_MIME) {
        if (depth >= 2) continue;
        var k = /block/i.test(f.name) ? 'blocker' : /work|done|progress/i.test(f.name) ? 'work' : kind;
        await gather(await listChildren(f.id), k, depth + 1);
      } else items.push({ id: f.id, name: f.name, mimeType: f.mimeType, parentKind: kind });
    }
  }
  await gather(files, '', 0);
  items.forEach(function (it) { it.role = classifyFile(it.name, it.mimeType, it.parentKind); });

  /* PDFs, Google Docs and text files: look at what is in them */
  for (var t = 0; t < items.length; t++) {
    var x = items[t];
    try {
      if (x.role === 'pdf') {
        if (!window.pdfjsLib) { warn('The PDF reader did not load, so ' + x.name + ' was skipped. Check your internet connection and reload.'); x.role = 'ignore'; continue; }
        say('Opening PDF ' + x.name + '…');
        var pages = await pdfToImages(await downloadBlob(x), 4);
        var ptxt = pages.text;
        x.pages = pages.urls;
        var pk = classifyImageText(ptxt);
        if (pk === 'photo' && window.Tesseract && pages.urls.length) { var pc = await classifyImage(pages.urls[0], tessPage); pk = pc.kind; x.rot = pc.rot; }
        if (pk === 'headcount' && parseHeadcount(ptxt).rows.length >= 3) { x.role = 'headcount-text'; x.text = ptxt; }
        else x.role = pk === 'headcount' ? 'headcount-img' : pk === 'dabs' ? 'dabs-img' : pk === 'welder' ? 'welder-img' : 'photo-work';
      } else if (x.role === 'text' || x.role === 'gdoc') {
        var tx = x.role === 'gdoc' ? await (await drive('files/' + x.id + '/export?mimeType=text%2Fplain')).text() : await (await downloadBlob(x)).text();
        var tk = classifyImageText(tx);
        if (tk === 'headcount') { x.role = 'headcount-text'; x.text = tx; } else x.role = 'ignore';
      }
    } catch (e) { warn('Could not open ' + x.name + ': ' + e.message); x.role = 'ignore'; }
  }

  /* Pictures with no clue in their name are read and sorted by what is on them */
  var loose = items.filter(function (it) { return it.role === 'image'; });
  for (var q = 0; q < loose.length; q++) {
    var it = loose[q];
    it.role = 'photo-work';
    if (!window.Tesseract) { if (!q) warn('The picture reader did not load, so pictures were all treated as photos. Check your internet connection and reload.'); continue; }
    try {
      say('Looking at picture ' + (q + 1) + ' of ' + loose.length + ' (' + it.name + ')…');
      var u = await blobToDataUrl(await downloadBlob(it));
      var cl = await classifyImage(u, tessPage);
      it.rot = cl.rot;
      it.role = cl.kind === 'headcount' ? 'headcount-img' : cl.kind === 'dabs' ? 'dabs-img' : cl.kind === 'welder' ? 'welder-img' : 'photo-work';
    } catch (e) { warn('Could not look at ' + it.name + ': ' + e.message); }
  }
  st.src.files = items.map(function (it) { return { name: it.name, role: it.role }; });
  /* image source of an item: a rendered PDF page or the picture itself */
  var itemUrl = async function (it) { return it.pages ? it.pages[0] : await blobToDataUrl(await downloadBlob(it)); };
  var by = function (role) { return items.filter(function (it) { return it.role === role; }).sort(function (a, b) { return a.name < b.name ? -1 : 1; }); };

  /* DABS */
  var dabsFiles = by('dabs').sort(function (a, b) { return (/dabs/i.test(b.name) ? 1 : 0) - (/dabs/i.test(a.name) ? 1 : 0); }).slice(0, 3);
  var dabs = null;
  if (!window.XLSX) warn('The Excel reader did not load. Check your internet connection and reload.');
  else if (!dabsFiles.length) { if (!by('dabs-img').length && !items.some(function (x) { return x.role === 'image'; })) warn('No DABS Excel file found in the folder.'); }
  else {
    for (var d = 0; d < dabsFiles.length; d++) {
      say('Reading DABS ' + dabsFiles[d].name + '…');
      try {
        var r = await readDabsBlob(await downloadBlob(dabsFiles[d]));
        if (r && (!dabs || r.jobs.length > dabs.res.jobs.length)) dabs = { res: r, name: dabsFiles[d].name };
      } catch (e) { warn('Could not read ' + dabsFiles[d].name + ': ' + e.message); }
    }
    if (dabs && dabs.res.jobs.length) {
      st.dabs = { file: dabs.name, jobs: dabs.res.jobs, warnings: dabs.res.warnings };
      st.src.dabsFile = dabs.name;
      st.concerns = dabs.res.concerns || [];
      if (dabs.res.night && dabs.res.night !== night.iso) warn('The DABS title says ' + fmtNight(dabs.res.night) + ' but the folder is ' + fmtNight(night.iso) + '. The folder date is used.');
    } else if (dabsFiles.length) warn('No jobs with a DONE / ONGOING / NOT DONE status were found in the DABS file.');
  }

  /* DABS as a picture (screenshot), only when no Excel was readable */
  var dabsImg = by('dabs-img')[0];
  if (!st.dabs.jobs.length && dabsImg && window.Tesseract) {
    try {
      say('Reading DABS picture ' + dabsImg.name + '…');
      var srcs = dabsImg.pages ? dabsImg.pages : [await blobToDataUrl(await downloadBlob(dabsImg))];
      var dr = { jobs: [], warnings: [] }, lastTitle = null;
      for (var pg = 0; pg < srcs.length; pg++) {
        var one = await readDabsImage(srcs[pg], tessRec, tessWords, dabsImg.rot || 0, undefined, function (a, n) { say('Reading DABS' + (srcs.length > 1 ? ' page ' + (pg + 1) : '') + ', job ' + a + ' of ' + n + '…'); }, lastTitle);
        dr.jobs = dr.jobs.concat(one.jobs); lastTitle = one.lastTitle || lastTitle;
        one.warnings.forEach(function (w) { if (dr.warnings.indexOf(w) < 0) dr.warnings.push(w); });
      }
      if (dr.jobs.length) {
        st.dabs = { file: dabsImg.name + ' (picture)', jobs: dr.jobs, warnings: dr.warnings };
        st.src.dabsFile = dabsImg.name + ' (picture)';
        dr.warnings.forEach(warn);
      } else warn('The DABS picture ' + dabsImg.name + ' was found but no jobs could be read from it.');
    } catch (e) { warn('Could not read the DABS picture: ' + e.message); }
  }
  /* Headcount */
  var hcText = by('headcount-text')[0], hcImg = by('headcount-img')[0], hcRes = null;
  if (hcText) {
    say('Reading headcount ' + hcText.name + '…');
    try {
      var hb = hcText.text != null ? null : await downloadBlob(hcText);
      var txt = hcText.text != null ? hcText.text : /\.(xlsx|xlsm|xls)$/i.test(hcText.name) || /spreadsheet|ms-excel/.test(hcText.mimeType) ? await sheetBlobToText(hb) : await hb.text();
      var pr = parseHeadcount(txt);
      if (pr.rows.length) {
        st.headcount = pr.rows; st.src.hcSource = hcText.name;
        st.src.hcCheck = { total: pr.total, sum: sumCounts(pr.rows), ok: pr.total == null || pr.total === sumCounts(pr.rows), note: '' };
      } else warn('No "trade number" lines found in ' + hcText.name + '.');
    } catch (e) { warn('Could not read ' + hcText.name + ': ' + e.message); }
  }
  if (!st.src.hcSource && hcImg) {
    try {
      var url = await itemUrl(hcImg);
      if (hcImg.rot) url = await rotatedUrl(url, hcImg.rot);
      st.src.hcImg = url;
      if (!window.Tesseract) warn('The picture reader did not load. Enter the headcount below, or upload headcount as a .txt or Excel file.');
      else {
        say('Reading headcount picture… (the first time can take a minute)');
        hcRes = await readHeadcountImage(url, tessRec, function (a, n) { say('Reading headcount picture, row ' + a + ' of ' + n + '…'); });
        if (hcRes.rows.length >= 3) {
          st.headcount = hcRes.rows.map(function (r) { return { name: r.name, count: r.count, unsure: r.unsure && !hcRes.ok }; });
          st.src.hcSource = hcImg.name;
          st.src.hcCheck = { total: hcRes.total, sum: hcRes.sum, ok: hcRes.ok, note: hcRes.note };
        } else warn('Could not read the headcount picture. ' + (hcRes.note || '') + ' Enter the numbers below.');
      }
    } catch (e) { warn('Could not read the headcount picture: ' + e.message); }
  }
  if (!st.src.hcSource && dabs && dabs.res.headcount) {
    st.headcount = dabs.res.headcount.rows;
    st.src.hcSource = dabs.name + ' (table under the report)';
    st.src.hcCheck = { total: dabs.res.headcount.total, sum: sumCounts(st.headcount), ok: dabs.res.headcount.total == null || dabs.res.headcount.total === sumCounts(st.headcount), note: '' };
  }
  if (!st.src.hcSource && !hcText && !hcImg) warn('No headcount table was found in the folder (a picture of the table, or a .txt / Excel file).');

  /* Welding sheet picture (for reference while entering counts) */
  var wl = by('welder-img')[0];
  if (wl && window.Tesseract) {
    try {
      say('Counting welders on the welding sheet…');
      var wsrc = wl.pages ? wl.pages[0] : await blobToDataUrl(await downloadBlob(wl));
      var wr = await readWelderSheet(wsrc, tessRec, tessWords, wl.rot || 0);
      if (wr.found) {
        st.welders = { ws: wr.ws, wsp: wr.wsp, fs: wr.fs, fsp: wr.fsp, ch: wr.ch };
        st.src.welderAuto = true;
        if (!wr.ch) warn('CH could not be read on the welding sheet. Enter it in step 2.');
      } else warn('The welder numbers could not be read from the welding sheet. Enter them in step 2.');
    } catch (e) { warn('Could not count the welders: ' + e.message); }
  }
  if (wl) { try { var wu = wl.pages ? wl.pages[0] : await compressImage(await downloadBlob(wl)); st.src.welderImg = wl.rot ? await rotatedUrl(wu, wl.rot) : wu; } catch (e) { warn('Could not open the welding sheet picture.'); } }

  /* Photos */
  var ph = by('photo-work').concat(by('photo-blocker')).sort(function (a, b) { return a.name < b.name ? -1 : 1; });
  if (ph.length > MAX_PHOTOS) { warn(ph.length + ' photos found; the first ' + MAX_PHOTOS + ' are used.'); ph = ph.slice(0, MAX_PHOTOS); }
  for (var p = 0; p < ph.length; p++) {
    say('Loading photo ' + (p + 1) + ' of ' + ph.length + '…');
    try {
      st.photos.push({ id: null, kind: ph[p].role === 'photo-blocker' ? 'blocker' : 'work', caption: photoCaption(ph[p].name), url: ph[p].pages ? ph[p].pages[0] : await compressImage(await downloadBlob(ph[p])) });
    } catch (e) { warn('Could not open photo ' + ph[p].name); }
  }
  var heic = by('heic').length;
  if (heic) warn(heic + ' iPhone (HEIC) photo(s) skipped. Share them as JPEG or set the camera to "Most compatible".');
  return st;
}

function reportData() {
  return { date: S.date, title: setting('title', 'W12 night shift report'), dabs: S.dabs, headcount: S.headcount, welders: S.welders, concerns: S.concerns, photos: S.photos };
}

async function makePdf() {
  var pages = buildReportPages(reportData(), UI.index);
  var host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px';
  host.innerHTML = pages.join('');

  try {
    var els = host.querySelectorAll('.rp');
    var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

/* ---------- Save / open a finished report ---------- */
async function saveNight(blobPdf) {
  var ix = await readIndex();
  var folder = await findOrCreateFolder(S.date, ix.root);
  var existing = {};
  (await listChildren(folder)).forEach(function (f) { existing[f.name] = f.id; });

  for (var i = 0; i < S.removedPhotoIds.length; i++) { try { await drive('files/' + S.removedPhotoIds[i], { method: 'DELETE' }); } catch (e) { /* already gone */ } }
  S.removedPhotoIds = [];

  for (var p = 0; p < S.photos.length; p++) {
    var ph = S.photos[p];
    if (!ph.id) {
      var blob = await (await fetch(ph.url)).blob();
      ph.id = await uploadFile('photo_' + Date.now() + '_' + p + '.jpg', blob, 'image/jpeg', folder);
    }
  }
  var data = { version: 2, date: S.date, title: setting('title', 'W12 night shift report'), dabs: S.dabs, headcount: S.headcount.map(function (r) { return { name: r.name, count: r.count }; }), welders: S.welders, concerns: S.concerns, photos: S.photos.map(function (x) { return { id: x.id, kind: x.kind, caption: x.caption }; }) };
  await uploadFile('data.json', new Blob([JSON.stringify(data)], { type: 'application/json' }), 'application/json', folder, existing['data.json']);
  var pdfName = 'Night report ' + S.date + '.pdf';
  var pdfId = await uploadFile(pdfName, blobPdf, 'application/pdf', folder, existing[pdfName]);

  var sum = calcSummary(S.dabs.jobs);
  var entry = { date: S.date, headcount: sumCounts(S.headcount), done: sum.done, ongoing: sum.ongoing, notdone: sum.notdone, folderId: folder, pdfId: pdfId };
  var list = ix.list.filter(function (e) { return e.date !== S.date; });
  list.push(entry);
  list.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  await uploadFile('index.json', new Blob([JSON.stringify(list)], { type: 'application/json' }), 'application/json', ix.root, ix.id);
  UI.index = list;
  return entry;
}

async function loadNight(entry) {
  var kids = await listChildren(entry.folderId);
  var df = kids.filter(function (f) { return f.name === 'data.json'; })[0];
  if (!df) throw new Error('data.json not found for ' + entry.date);
  var d = await downloadJson(df.id);
  var photos = await Promise.all((d.photos || []).map(async function (p) {
    var b = await (await drive('files/' + p.id + '?alt=media')).blob();
    return { id: p.id, kind: p.kind, caption: p.caption || '', url: await blobToDataUrl(b) };
  }));
  S = freshState();
  S.date = d.date;
  S.dabs = d.dabs || S.dabs;
  S.headcount = d.headcount || S.headcount;
  S.welders = d.welders || S.welders;
  S.concerns = d.concerns || [];
  S.photos = photos;
}

/* ---------- Screens ---------- */
function chip(n, cls, label) { return '<span class="chip ' + cls + '">' + n + ' ' + label + '</span>'; }

function histChart(list) {
  var pts = (list || []).slice(-30);
  if (pts.length < 2) return '<p class="muted">Headcount history appears after you save two nights.</p>';
  var W = 640, H = 120, base = 98, bw = Math.min(44, W / pts.length), max = Math.max.apply(null, pts.map(function (p) { return p.headcount; })) || 1;
  var bars = pts.map(function (p, i) {
    var h = Math.max(2, Math.round(p.headcount / max * 70));
    var x = i * bw;
    return '<rect x="' + (x + 2).toFixed(1) + '" y="' + (base - h) + '" width="' + (bw - 4).toFixed(1) + '" height="' + h + '" rx="3" fill="#1f3864"/>' +
      '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (base - h - 4) + '" text-anchor="middle" font-size="10" fill="#333">' + p.headcount + '</text>' +
      (pts.length <= 15 || i % 2 === 0 ? '<text x="' + (x + bw / 2).toFixed(1) + '" y="112" text-anchor="middle" font-size="9" fill="#777">' + shortDate(p.date) + '</text>' : '');
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-height:150px" role="img" aria-label="Headcount per night">' + bars + '</svg>';
}
